baseURL: "https://github.com/qlskd/My_Profile"
languageCode: "ko"
title: "신선하 포트폴리오"


# Multilingual configuration
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false

languages:
  ko:
    languageCode: "ko"
    languageName: "한국어"
    weight: 1
    contentDir: "content"
    menu:
      main: []
      
outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

